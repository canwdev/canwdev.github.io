<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material 色板 · 亮/暗背景图标用色选择器</title>
<style>
  :root{
    --page-bg:#eceef4;
    --panel:#ffffff;
    --line:#e3e6ee;
    --text:#191d26;
    --muted:#79808f;
    --accent:#2f6bff;    /* 亮背景选中环 */
    --accent2:#ff9d2e;   /* 暗背景选中环 */
    --ok:#1f9d55;
    --warn:#d9432f;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; padding:26px 20px 60px;
    background:var(--page-bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:1720px; margin:0 auto; }

  /* ---------- 顶部 ---------- */
  .page-head{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:16px; flex-wrap:wrap; margin-bottom:22px;
  }
  .page-head h1{ font-size:19px; margin:0 0 6px; letter-spacing:.3px; }
  .page-head .sub{ font-size:12.5px; color:var(--muted); margin:0; line-height:1.75; }
  .page-head .sub code{
    background:#dfe3ee; color:#3c445a; border-radius:5px;
    padding:1px 5px; font-size:11.5px; font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .seg{ display:inline-flex; background:#dfe3ec; border-radius:11px; padding:3px; gap:2px; }
  .seg button{
    border:0; background:transparent; font:inherit; font-size:13px; font-weight:600;
    color:#5c6478; padding:7px 16px; border-radius:9px; cursor:pointer; transition:.15s;
  }
  .seg button.active{ background:#fff; color:#1c2029; box-shadow:0 1px 4px rgba(20,25,40,.14); }

  .btn{
    border:1px solid var(--line); background:#fff; font:inherit; font-size:13px; font-weight:600;
    color:var(--text); padding:9px 16px; border-radius:10px; cursor:pointer; transition:.15s;
  }
  .btn:hover{ border-color:#c8cddb; background:#f7f8fb; }
  .btn:active{ transform:translateY(1px); }

  /* ---------- 卡片网格 ---------- */
  .palettes{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(min(700px,100%), 1fr));
    gap:16px;
  }
  .card{
    background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:15px 18px 14px;
    box-shadow:0 1px 2px rgba(20,25,40,.05);
  }
  .card-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:14px; flex-wrap:wrap; margin-bottom:12px;
  }
  .pal-name h2{ font-size:15px; margin:0 0 2px; font-weight:700; letter-spacing:.2px; }
  .pal-name span{ font-size:11px; color:var(--muted); }

  .slots{ display:flex; gap:8px; flex-wrap:wrap; }
  .slot{
    display:flex; align-items:center; gap:9px;
    padding:4px 11px 4px 4px; border-radius:12px;
    background:#f6f7fa; border:1px solid var(--line);
  }
  .slot-preview{
    width:36px; height:36px; flex:none; border-radius:9px;
    display:grid; place-items:center;
  }
  .slot-preview.on-light{ background:#ffffff; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); }
  .slot-preview.on-dark { background:#111111; box-shadow:inset 0 0 0 1px rgba(255,255,255,.16); }
  .slot-preview svg{ width:20px; height:20px; display:block; }
  .slot-info{ display:flex; flex-direction:column; line-height:1.35; }
  .slot-info b{ font-size:11px; font-weight:700; white-space:nowrap; }
  .slot-info span{ font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .slot-info .cr{ font-style:normal; font-weight:700; }
  .slot-info .cr.ok{ color:var(--ok); }
  .slot-info .cr.bad{ color:var(--warn); }

  /* ---------- 两行（亮 / 暗） ---------- */
  .palette-rows{ display:flex; flex-direction:column; gap:4px; }

  .palette-row{ display:flex; align-items:flex-start; gap:10px; min-width:0; }

  .row-label{
    flex:none; width:22px; height:36px; margin-top:5px;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; border-radius:7px;
    letter-spacing:1px; user-select:none;
  }
  .row-label.light{ background:#eaf0ff; color:var(--accent); }
  .row-label.dark { background:#fff3e0; color:#c97a0d; }

  /* 横向不换行；放不下时行内横向滚动 */
  .cells{
    display:flex; flex-wrap:nowrap; gap:7px;
    padding:6px 4px 7px;
    overflow-x:auto; overflow-y:hidden;
    min-width:0; flex:1 1 auto;
    scrollbar-width:thin;
  }
  .cells::-webkit-scrollbar{ height:6px; }
  .cells::-webkit-scrollbar-track{ background:transparent; }
  .cells::-webkit-scrollbar-thumb{ background:#d7dce8; border-radius:3px; }
  .cells::-webkit-scrollbar-thumb:hover{ background:#c2c9da; }

  .cell-wrap{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    flex:0 0 auto;
  }

  .cell{
    width:38px; height:38px;
    border:0; padding:0; margin:0;
    border-radius:9px;
    display:grid; place-items:center;
    cursor:pointer;
    outline:0 solid transparent;
    outline-offset:1px;
    transition:outline-color .12s, outline-width .12s, transform .08s;
  }
  .cell svg{ width:24px; height:24px; display:block; pointer-events:none; }
  .cell:active{ transform:scale(.94); }

  .cell.light{ background:#ffffff; box-shadow:inset 0 0 0 1px rgba(0,0,0,.11); }
  .cell.dark { background:#111111; box-shadow:inset 0 0 0 1px rgba(255,255,255,.15); }

  /* hover 提示 */
  .cell.light:hover{ outline:3px solid rgba(47,107,255,.40); }
  .cell.dark:hover { outline:3px solid rgba(255,157,46,.55); }
  /* 选中态（置于 hover 之后以覆盖） */
  .cell.light.sel-light{ outline:3px solid var(--accent); }
  .cell.dark.sel-dark  { outline:3px solid var(--accent2); }

  .shade-name{
    font-size:10px; line-height:1.1; color:#9aa1b0;
    font-variant-numeric:tabular-nums; letter-spacing:.2px;
    white-space:nowrap;
  }
  .shade-name.on{ color:#2b3243; font-weight:800; }

  /* ---------- 输出 ---------- */
  .output{
    margin-top:26px; background:#1b1f2a; border-radius:16px;
    padding:16px 20px 18px; overflow:hidden;
  }
  .output-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:12px; flex-wrap:wrap;
  }
  .output-head h2{ font-size:13px; margin:0; color:#9aa3b8; font-weight:600; letter-spacing:.4px; }
  .output-head .btn{
    background:#262b38; border-color:#333a4b; color:#c3cadb; padding:6px 13px; font-size:12px;
  }
  .output-head .btn:hover{ background:#2f3547; border-color:#414a60; }
  .output pre{
    margin:0; max-height:440px; overflow:auto;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.5px; line-height:1.68; color:#e6e9f2; white-space:pre;
  }
  .output pre::-webkit-scrollbar{ width:9px; height:9px; }
  .output pre::-webkit-scrollbar-thumb{ background:#3a4152; border-radius:6px; }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:32px; transform:translate(-50%,14px);
    background:#1c2029; color:#fff; font-size:13px; font-weight:600;
    padding:10px 20px; border-radius:10px; opacity:0; pointer-events:none;
    transition:.22s; box-shadow:0 8px 24px rgba(0,0,0,.3); z-index:99;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  @media (max-width:760px){
    body{ padding:18px 12px 50px; }
    .card{ padding:13px 12px 12px; }
    .cell{ width:34px; height:34px; }
    .cell svg{ width:22px; height:22px; }
    .cells{ gap:6px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="page-head">
    <div>
      <h1>Material 色板 · 亮/暗背景图标用色</h1>
      <p class="sub">
        亮色背景 <code>#ffffff</code> &nbsp;·&nbsp; 暗色背景 <code>#111111</code>
        &nbsp;·&nbsp; 每个颜色固定两行：<b>上行亮背景</b>、<b>下行暗背景</b>，直接点五角星单选
        &nbsp;·&nbsp; 默认按 WCAG AA（对比度 ≥ 4.5:1）自动预选

    </div>

  <div class="output">

      <h2>OUTPUT JSON</h2>
      <button class="btn" id="btn-copy">复制 JSON</button>
    </div>

  </div>

</div>

<div class="toast" id="toast">已复制到剪贴板</div>

/* =========================================================
   2. 常量（与 Python 脚本一致）
   ========================================================= */
const LIGHT_BG_RGB = [255, 255, 255];   // #ffffff
const DARK_BG_RGB  = [17, 17, 17];      // #111111

const MIN_RATIO   = 4.5;
const LIGHT_ORDER = ['500','600','700','800','900'];   // 白底：由浅到深
const DARK_ORDER  = ['300','200','a100','400'];        // 黑底：由亮到暗
const LIGHT_FALLBACK = '900';
const DARK_FALLBACK  = 'a100';

const LABELS = [
  ['red','Red'], ['pink','Pink'], ['purple','Purple'],
  ['deeppurple','Deep Purple'], ['indigo','Indigo'], ['blue','Blue'],
  ['lightblue','Light Blue'], ['cyan','Cyan'], ['teal','Teal'],
  ['green','Green'], ['lightgreen','Light Green'], ['lime','Lime'],
  ['yellow','Yellow'], ['amber','Amber'], ['orange','Orange'],
  ['deeporange','Deep Orange'], ['brown','Brown'], ['grey','Grey'],
  ['bluegrey','Blue Grey']
];

/* 实心五角星（24px 由 CSS 控制） */
const STAR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
  '<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>';

/* =========================================================
   3. 颜色工具
   ========================================================= */
function hex2rgb(h){
  h = h.replace('#','');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgb2str(rgb){ return rgb[0] + ',' + rgb[1] + ',' + rgb[2]; }
function lum(rgb){
  const c = rgb.map(v => {
    v /= 255;
    return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
}
function contrast(a, b){
  const l1 = lum(a), l2 = lum(b);
  const hi = Math.max(l1,l2), lo = Math.min(l1,l2);
  return (hi + 0.05) / (lo + 0.05);
}

/* 自动挑选：按优先级顺序取第一个达标色阶；全不达标则用兜底档 */
function autoPick(shades, order, bgRGB, fallbackShade){
  for (const k of order){
    if (shades[k] !== undefined && contrast(hex2rgb(shades[k]), bgRGB) >= MIN_RATIO){
      return { shade:k, ok:true };
    }
  }
  if (fallbackShade && shades[fallbackShade] !== undefined){
    return { shade:fallbackShade, ok:false };
  }
  const avail = order.filter(k => shades[k] !== undefined);
  if (avail.length) return { shade:avail[avail.length-1], ok:false };
  const keys = Object.keys(shades);
  return { shade:keys[keys.length-1], ok:false };
}

/* =========================================================
   4. 状态
   ========================================================= */
let fmt = 'rgb';
const state = {};

function initState(){
  LABELS.forEach(([key]) => {
    const shades = PALETTES[key];
    state[key] = {
      light: autoPick(shades, LIGHT_ORDER, LIGHT_BG_RGB, LIGHT_FALLBACK),
      dark : autoPick(shades, DARK_ORDER,  DARK_BG_RGB,  DARK_FALLBACK)
    };
  });
}

/* =========================================================
   5. 渲染
   ========================================================= */
function buildCard(key, label){
  const pal = PALETTES[key];
  const st  = state[key];
  const shades = Object.keys(pal);

  const lightHex = pal[st.light.shade];
  const darkHex  = pal[st.dark.shade];
  const lightCR  = contrast(hex2rgb(lightHex), LIGHT_BG_RGB);
  const darkCR   = contrast(hex2rgb(darkHex),  DARK_BG_RGB);

  const lCrCls = lightCR >= MIN_RATIO ? 'ok' : 'bad';
  const dCrCls = darkCR  >= MIN_RATIO ? 'ok' : 'bad';

  /* ---- 两行：上行亮背景，下行暗背景，行内不换行 ---- */
  let lightCells = '';
  let darkCells  = '';

  shades.forEach(shade => {
    const hex = pal[shade];
    const isL = st.light.shade === shade;
    const isD = st.dark.shade  === shade;

    lightCells +=
      '<div class="cell-wrap">' +
        '<button type="button" class="cell light' + (isL ? ' sel-light' : '') + '"' +
          ' data-key="' + key + '" data-shade="' + shade + '" data-slot="light"' +
          ' style="color:' + hex + '"' +
          ' title="亮背景 #ffffff · ' + shade + ' ' + hex + '"' +
          ' aria-label="亮背景 ' + shade + '">' + STAR + '</button>' +
        '<span class="shade-name' + (isL ? ' on' : '') + '">' + shade + '</span>' +
      '</div>';

    darkCells +=
      '<div class="cell-wrap">' +
        '<button type="button" class="cell dark' + (isD ? ' sel-dark' : '') + '"' +
          ' data-key="' + key + '" data-shade="' + shade + '" data-slot="dark"' +
          ' style="color:' + hex + '"' +
          ' title="暗背景 #111111 · ' + shade + ' ' + hex + '"' +
          ' aria-label="暗背景 ' + shade + '">' + STAR + '</button>' +
        '<span class="shade-name' + (isD ? ' on' : '') + '">' + shade + '</span>' +
      '</div>';
  });

  return '' +
    '<section class="card">' +
      '<div class="card-head">' +
        '<div class="pal-name">' +
          '<h2>' + label + '</h2>' +
          '<span>' + shades.length + ' 个色阶</span>' +
        '</div>' +
        '<div class="slots">' +
          '<div class="slot">' +
            '<div class="slot-preview on-light" style="color:' + lightHex + '">' + STAR + '</div>' +
            '<div class="slot-info">' +
              '<b>亮色 · ' + st.light.shade + '</b>' +
              '<span>' + lightHex + ' · <i class="cr ' + lCrCls + '">' +
                lightCR.toFixed(1) + ':1</i></span>' +
            '</div>' +
          '</div>' +
          '<div class="slot">' +
            '<div class="slot-preview on-dark" style="color:' + darkHex + '">' + STAR + '</div>' +
            '<div class="slot-info">' +
              '<b>暗色 · ' + st.dark.shade + '</b>' +
              '<span>' + darkHex + ' · <i class="cr ' + dCrCls + '">' +
                darkCR.toFixed(1) + ':1</i></span>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="palette-rows">' +
        '<div class="palette-row">' +
          '<span class="row-label light">亮</span>' +
          '<div class="cells">' + lightCells + '</div>' +
        '</div>' +
        '<div class="palette-row">' +
          '<span class="row-label dark">暗</span>' +
          '<div class="cells">' + darkCells + '</div>' +
        '</div>' +
      '</div>' +
    '</section>';
}

function renderPalettes(){
  document.getElementById('palettes').innerHTML =
    LABELS.map(([key,label]) => buildCard(key, label)).join('');
}

function buildOutput(){
  const lines = LABELS.map(([key, label]) => {
    const st = state[key];
    const lh = PALETTES[key][st.light.shade];
    const dh = PALETTES[key][st.dark.shade];
    if (fmt === 'rgb'){
      return "  { label: '" + label + "', rgb: { light: '" + rgb2str(hex2rgb(lh)) +
             "', dark: '" + rgb2str(hex2rgb(dh)) + "' } },";
    }
    return "  { label: '" + label + "', hex: { light: '" + lh +
           "', dark: '" + dh + "' } },";
  });
  return '[\n' + lines.join('\n') + '\n]';
}

function renderOutput(){
  document.getElementById('out').textContent = buildOutput();
}

function render(){
  renderPalettes();
  renderOutput();
}

/* =========================================================
   6. 交互
   ========================================================= */
document.getElementById('palettes').addEventListener('click', e => {
  const btn = e.target.closest('.cell');
  if (!btn) return;
  const { key, shade, slot } = btn.dataset;
  state[key][slot].shade = shade;
  state[key][slot].ok = true;
  render();
});

document.getElementById('seg').addEventListener('click', e => {
  const btn = e.target.closest('[data-fmt]');
  if (!btn) return;
  fmt = btn.dataset.fmt;
  [...document.querySelectorAll('#seg [data-fmt]')]
    .forEach(b => b.classList.toggle('active', b === btn));
  renderOutput();
});

document.getElementById('btn-reset').addEventListener('click', () => {
  initState();
  render();
  toast('已按 WCAG AA 重新自动匹配');
});

document.getElementById('btn-copy').addEventListener('click', async () => {
  const text = document.getElementById('out').textContent;
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制到剪贴板');
  } catch (err){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('已复制到剪贴板');
  }
});

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

/* =========================================================
   7. 启动
   ========================================================= */
initState();
render();
</script>
</body>
</html>
